<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificats administratifs</title>

    <link rel="stylesheet" href="certificat.css">

    <link rel="stylesheet"

<header>

    <a href="accueil.html" class="back">

    <h2>Certificats administratifs</h2>

<div class="container">

    <div class="image">
        <img src="images/certificat.png" alt="Certificats">
    </div>

    <h3>Choisissez un certificat</h3>

    <div class="cards">

        <div class="card" onclick="showResidence()">
            <i class="fa-solid fa-house"></i>
            <h4>Certificat de résidence</h4>
           
        </div>

        <div class="card" onclick="showAdministratif()">
            <i class="fa-solid fa-location-dot"></i>
            <h4>Certificat administratif de résidence</h4>
        </div>

        <div class="card" onclick="showDeces()">
            <i class="fa-solid fa-cross"></i>
            <h4>Certificat de décès</h4>
        </div>

        <div class="card" onclick="showNaissance()">
            <i class="fa-solid fa-baby"></i>
            <h4>Acte de naissance</h4>
        </div>

        <div class="card" onclick="showProfession()">
            <i class="fa-solid fa-briefcase"></i>
            <h4>Certificat de profession</h4>
        </div>

    </div>

    <!-- Certificat de résidence -->

    <div id="residence" class="documents">

        <h3>Documents requis</h3>
         <div id="résidence"> </div>

        </ul>-->

    <div id="administratif" class="documents">

        <h3>Documents requis</h3>
        <div id="certificat"> </div>

      <!--  <ul>

        <div id="Certificat de décès"> </div>

        </ul>-->

        <div id="Certificat de profession"> </div>
